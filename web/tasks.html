<!DOCTYPE html>
<html lang="zh-CN" x-data="tasksComponent()" @keydown.escape="showModal = false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务中心 - CoolClaw</title>
    
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <script src="https://unpkg.com/alpinejs@3.13.5" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#00d9ff',
                        secondary: '#0f3460',
                        dark: '#1a1a2e',
                        surface: '#16213e',
                        card: '#0d1b2a',
                    }
                }
            }
        }
    </script>
    
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d1b2a; }
        ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 4px; }
    </style>
</head>
<body class="bg-dark text-gray-100 min-h-screen">
    
    <!-- Navigation -->
    <nav class="bg-surface border-b border-secondary px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <span class="text-xl font-bold text-primary">🦞 CoolClaw · 任务中心</span>
        <div class="flex items-center gap-2">
            <a href="/" class="px-4 py-2 rounded-lg hover:bg-secondary text-gray-400">💬 对话</a>
            <a href="/" class="px-4 py-2 rounded-lg bg-secondary text-primary">📋 任务</a>
            <a href="/logs.html" class="px-4 py-2 rounded-lg hover:bg-secondary text-gray-400">📊 日志</a>
            <a href="/settings.html" class="px-4 py-2 rounded-lg hover:bg-secondary text-gray-400">⚙️ 设置</a>
        </div>
    </nav>
    
    <!-- Main content -->
    <div class="container mx-auto max-w-6xl px-4 py-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-2xl font-bold">自动化任务</h2>
                <p class="text-gray-400 text-sm mt-1">创建和管理你的自动化任务</p>
            </div>
            <button @click="openCreateModal()" class="px-4 py-2 bg-primary text-dark font-bold rounded-lg hover:bg-primary/90 transition">
                + 新建任务
            </button>
        </div>
        
        <!-- Task list -->
        <div class="space-y-4" x-show="tasks.length > 0">
            <template x-for="task in tasks" :key="task.id">
                <div class="bg-surface rounded-xl p-5 border border-secondary hover:border-primary/50 transition">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-primary" x-text="task.name"></h3>
                            <p class="text-gray-400 text-sm" x-show="task.description" x-text="task.description"></p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-medium"
                              :class="{
                                  'bg-green-500/20 text-green-400': task.status === 'active',
                                  'bg-yellow-500/20 text-yellow-400': task.status === 'paused',
                                  'bg-red-500/20 text-red-400': task.status === 'failed'
                              }"
                              x-text="{
                                  'active': '运行中',
                                  'paused': '已暂停',
                                  'failed': '失败'
                              }[task.status] || task.status">
                        </span>
                    </div>
                    
                    <!-- Meta info -->
                    <div class="flex flex-wrap gap-4 text-sm text-gray-400 mb-4">
                        <span class="flex items-center gap-1">
                            ⏰ <span x-text="formatTrigger(task.trigger)"></span>
                        </span>
                        <span class="flex items-center gap-1">
                            📦 <span x-text="task.steps.length"></span> 步骤
                        </span>
                        <span x-show="task.last_run" class="flex items-center gap-1">
                            🕐 <span x-text="new Date(task.last_run).toLocaleString()"></span>
                        </span>
                        <span x-show="task.notification_enabled" class="text-primary">🔔 通知</span>
                    </div>
                    
                    <!-- Steps preview -->
                    <div class="flex flex-wrap gap-2 mb-4">
                        <template x-for="(step, idx) in task.steps" :key="idx">
                            <span class="px-2 py-1 bg-card rounded text-sm text-gray-300">
                                <span x-text="idx + 1"></span>. <span x-text="step.capability"></span>
                            </span>
                        </template>
                    </div>
                    
                    <!-- Actions -->
                    <div class="flex gap-2 pt-3 border-t border-secondary">
                        <button @click="runTask(task.id)" 
                                :disabled="task.status !== 'active'"
                                class="px-3 py-1.5 bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed rounded text-sm font-medium transition">
                            ▶ 执行
                        </button>
                        <button @click="viewLogs(task.id)" class="px-3 py-1.5 bg-secondary hover:bg-secondary/80 rounded text-sm transition">
                            📊 日志
                        </button>
                        <button @click="toggleTask(task)" class="px-3 py-1.5 bg-secondary hover:bg-secondary/80 rounded text-sm transition">
                            <span x-text="task.status === 'active' ? '⏸' : '▶'"></span>
                        </button>
                        <button @click="deleteTask(task.id)" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/40 text-red-400 rounded text-sm transition">
                            🗑 删除
                        </button>
                    </div>
                </div>
            </template>
        </div>
        
        <!-- Empty state -->
        <div x-show="tasks.length === 0" class="text-center py-20">
            <div class="text-6xl mb-4">📋</div>
            <h3 class="text-xl font-bold text-gray-400 mb-2">暂无任务</h3>
            <p class="text-gray-500 mb-6">创建你的第一个自动化任务</p>
            <button @click="openCreateModal()" class="px-6 py-3 bg-primary text-dark font-bold rounded-lg hover:bg-primary/90 transition">
                + 新建任务
            </button>
        </div>
    </div>
    
    <!-- Create/Edit Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" @click.self="showModal = false">
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="relative bg-surface rounded-xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b border-secondary flex items-center justify-between">
                <h3 class="text-lg font-bold">新建任务</h3>
                <button @click="showModal = false" class="p-2 hover:bg-secondary rounded">✕</button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">任务名称 *</label>
                    <input type="text" id="task-name" class="w-full bg-card border border-secondary rounded-lg px-3 py-2 focus:border-primary focus:outline-none" placeholder="例如：每日AI新闻">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">描述</label>
                    <input type="text" id="task-desc" class="w-full bg-card border border-secondary rounded-lg px-3 py-2 focus:border-primary focus:outline-none" placeholder="任务描述（可选）">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">触发方式</label>
                    <select id="trigger-type" class="w-full bg-card border border-secondary rounded-lg px-3 py-2 focus:border-primary focus:outline-none" onchange="window.tasksComponentInstance?.toggleTriggerUI()">
                        <option value="manual">手动执行</option>
                        <option value="interval">间隔执行</option>
                        <option value="cron">Cron 表达式</option>
                    </select>
                </div>
                
                <div id="interval-ui" class="hidden">
                    <label class="block text-sm font-medium mb-1">间隔（秒）</label>
                    <input type="number" id="interval-sec" value="3600" class="w-full bg-card border border-secondary rounded-lg px-3 py-2 focus:border-primary focus:outline-none">
                </div>
                
                <div id="cron-ui" class="hidden">
                    <label class="block text-sm font-medium mb-1">Cron 表达式</label>
                    <input type="text" id="cron-expr" placeholder="0 8 * * *" class="w-full bg-card border border-secondary rounded-lg px-3 py-2 focus:border-primary focus:outline-none">
                    <p class="text-xs text-gray-500 mt-1">格式: 分 时 日 月 周 (例如: 0 8 * * * = 每天8点)</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">执行步骤</label>
                    <div id="steps-container" class="space-y-3"></div>
                    <button type="button" onclick="window.tasksComponentInstance?.addStep()" class="mt-2 px-3 py-2 bg-secondary hover:bg-secondary/80 rounded text-sm">
                        + 添加步骤
                    </button>
                </div>
            </div>
            
            <div class="p-4 border-t border-secondary flex justify-end gap-3">
                <button @click="showModal = false" class="px-4 py-2 bg-secondary hover:bg-secondary/80 rounded transition">取消</button>
                <button onclick="window.tasksComponentInstance?.submitTask()" class="px-4 py-2 bg-primary text-dark font-bold rounded hover:bg-primary/90 transition">创建</button>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="fixed bottom-4 right-4 space-y-2" x-data="{ toasts: [] }" @toast.window="toasts.push($event.detail); setTimeout(() => toasts.shift(), 3000)">
        <template x-for="t in toasts" :key="t">
            <div class="px-4 py-3 rounded-lg shadow-lg"
                 :class="{'bg-primary text-dark': t.type!='error', 'bg-red-500 text-white': t.type=='error'}">
                <span x-text="t.message"></span>
            </div>
        </template>
    </div>
    
    <!-- Log Modal -->
    <div id="log-modal" x-data="{ show: false, logs: [], loading: false }" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-black/70" onclick="document.getElementById('log-modal').classList.add('hidden')"></div>
        <div class="relative bg-surface rounded-xl w-full max-w-3xl max-h-[80vh] overflow-hidden flex flex-col">
            <div class="p-4 border-b border-secondary flex items-center justify-between">
                <h3 class="text-lg font-bold">执行日志</h3>
                <button onclick="document.getElementById('log-modal').classList.add('hidden')" class="p-2 hover:bg-secondary rounded">✕</button>
            </div>
            <div class="p-4 overflow-y-auto" id="log-content"></div>
        </div>
    </div>
    
    <script>
        let stepCounter = 0;
        
        function tasksComponent() {
            return {
                tasks: [],
                capabilities: [],
                showModal: false,
                editingTask: null,
                
                async init() {
                    await this.loadData();
                },
                
                async loadData() {
                    try {
                        const [tasksRes, capsRes] = await Promise.all([
                            fetch('/api/tasks'),
                            fetch('/api/capabilities')
                        ]);
                        const tasksData = await tasksRes.json();
                        const capsData = await capsRes.json();
                        this.tasks = tasksData.tasks || [];
                        this.capabilities = capsData.capabilities || [];
                    } catch (e) {
                        console.error('Failed to load data:', e);
                    }
                },
                
                openCreateModal() {
                    document.getElementById('task-name').value = '';
                    document.getElementById('task-desc').value = '';
                    document.getElementById('trigger-type').value = 'manual';
                    document.getElementById('steps-container').innerHTML = '';
                    stepCounter = 0;
                    this.addStep();
                    this.showModal = true;
                },
                
                toggleTriggerUI() {
                    const type = document.getElementById('trigger-type').value;
                    document.getElementById('interval-ui').classList.toggle('hidden', type !== 'interval');
                    document.getElementById('cron-ui').classList.toggle('hidden', type !== 'cron');
                },
                
                addStep() {
                    const container = document.getElementById('steps-container');
                    stepCounter++;
                    const html = `
                        <div class="bg-card rounded-lg p-3 border border-secondary step-item" id="step-${stepCounter}">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-sm text-primary font-medium">步骤 ${stepCounter}</span>
                                <button type="button" onclick="this.closest('.step-item').remove()" class="ml-auto text-red-400 hover:text-red-300">🗑</button>
                            </div>
                            <select class="w-full bg-surface border border-secondary rounded px-3 py-2 mb-2 text-sm" onchange="window.tasksComponentInstance?.updateStepParams(${stepCounter})">
                                <option value="">+ 选择能力</option>
                                ${this.capabilities.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                            </select>
                            <div class="step-params"></div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                },
                
                updateStepParams(stepId) {
                    const stepEl = document.getElementById(`step-${stepId}`);
                    const capName = stepEl.querySelector('select').value;
                    const paramsDiv = stepEl.querySelector('.step-params');
                    
                    if (!capName) {
                        paramsDiv.innerHTML = '';
                        return;
                    }
                    
                    const cap = this.capabilities.find(c => c.name === capName);
                    if (!cap || !cap.input_schema) {
                        paramsDiv.innerHTML = '';
                        return;
                    }
                    
                    const props = cap.input_schema.properties || {};
                    const required = cap.input_schema.required || [];
                    
                    let html = '<div class="grid grid-cols-2 gap-2">';
                    for (const [key, field] of Object.entries(props)) {
                        const isReq = required.includes(key);
                        html += `
                            <div>
                                <label class="text-xs text-gray-400">${isReq ? '<span class="text-red-400">*</span>' : ''}${key}</label>
                                ${field.type === 'boolean' 
                                    ? `<input type="checkbox" data-key="${key}" class="step-param">` 
                                    : `<input type="${field.type === 'integer' ? 'number' : 'text'}" data-key="${key}" class="step-param w-full bg-surface border border-secondary rounded px-2 py-1 text-sm" placeholder="${field.description || ''}">`}
                            </div>
                        `;
                    }
                    html += '</div>';
                    paramsDiv.innerHTML = html;
                },
                
                async submitTask() {
                    const name = document.getElementById('task-name').value.trim();
                    if (!name) {
                        window.dispatchEvent(new CustomEvent('toast', { detail: { message: '请输入任务名称', type: 'error' } }));
                        return;
                    }
                    
                    const steps = [];
                    document.querySelectorAll('.step-item').forEach(stepEl => {
                        const cap = stepEl.querySelector('select').value;
                        if (!cap) return;
                        
                        const params = {};
                        stepEl.querySelectorAll('.step-param').forEach(input => {
                            const key = input.dataset.key;
                            if (input.type === 'checkbox') params[key] = input.checked;
                            else if (input.value) params[key] = input.value;
                        });
                        steps.push({ capability: cap, params });
                    });
                    
                    if (steps.length === 0) {
                        window.dispatchEvent(new CustomEvent('toast', { detail: { message: '请添加至少一个步骤', type: 'error' } }));
                        return;
                    }
                    
                    const trigger = { type: document.getElementById('trigger-type').value };
                    if (trigger.type === 'interval') trigger.interval_seconds = parseInt(document.getElementById('interval-sec').value) || 3600;
                    if (trigger.type === 'cron') trigger.cron_expr = document.getElementById('cron-expr').value;
                    
                    try {
                        const res = await fetch('/api/tasks', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name, description: document.getElementById('task-desc').value, steps, trigger })
                        });
                        
                        if (!res.ok) throw new Error('创建失败');
                        
                        window.dispatchEvent(new CustomEvent('toast', { detail: { message: '任务创建成功', type: 'success' } }));
                        this.showModal = false;
                        await this.loadData();
                    } catch (e) {
                        window.dispatchEvent(new CustomEvent('toast', { detail: { message: '创建失败', type: 'error' } }));
                    }
                },
                
                async runTask(id) {
                    window.dispatchEvent(new CustomEvent('toast', { detail: { message: '执行中...' } }));
                    try {
                        const res = await fetch(`/api/tasks/${id}/run`, { method: 'POST' });
                        const d = await res.json();
                        if (d.success) {
                            window.dispatchEvent(new CustomEvent('toast', { detail: { message: '执行成功', type: 'success' } }));
                        } else {
                            window.dispatchEvent(new CustomEvent('toast', { detail: { message: '执行失败: ' + (d.error || ''), type: 'error' } }));
                        }
                    } catch (e) {
                        window.dispatchEvent(new CustomEvent('toast', { detail: { message: '执行失败', type: 'error' } }));
                    }
                },
                
                async viewLogs(id) {
                    const modal = document.getElementById('log-modal');
                    const content = document.getElementById('log-content');
                    modal.classList.remove('hidden');
                    content.innerHTML = '<p class="text-gray-400">加载中...</p>';
                    
                    try {
                        const res = await fetch(`/api/tasks/${id}/logs`);
                        const d = await res.json();
                        const logs = d.logs || [];
                        
                        if (logs.length === 0) {
                            content.innerHTML = '<p class="text-gray-400 text-center py-8">暂无日志</p>';
                            return;
                        }
                        
                        const log = logs[0];
                        const steps = log.results || log.step_logs || [];
                        content.innerHTML = `
                            <div class="space-y-3">
                                <div class="flex items-center gap-3">
                                    <span class="px-2 py-1 rounded text-sm ${log.success ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                                        ${log.success ? '✅ 成功' : '❌ 失败'}
                                    </span>
                                    <span class="text-sm text-gray-400">${new Date(log.started_at).toLocaleString()}</span>
                                </div>
                                ${steps.map(s => `
                                    <div class="bg-card rounded-lg p-3">
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="px-2 py-0.5 bg-secondary rounded text-sm">${s.capability}</span>
                                            <span class="${s.success ? 'text-green-400' : 'text-red-400'} text-sm">${s.success ? '✅' : '❌'} ${s.duration_ms}ms</span>
                                        </div>
                                        ${s.error ? `<p class="text-red-400 text-sm">${s.error}</p>` : ''}
                                    </div>
                                `).join('')}
                                ${log.final_output ? `<div class="bg-card rounded-lg p-3 mt-3"><pre class="whitespace-pre-wrap text-sm">${log.final_output}</pre></div>` : ''}
                            </div>
                        `;
                    } catch (e) {
                        content.innerHTML = '<p class="text-red-400">加载失败</p>';
                    }
                },
                
                async toggleTask(task) {
                    const action = task.status === 'active' ? 'pause' : 'resume';
                    await fetch(`/api/tasks/${task.id}/${action}`, { method: 'POST' });
                    await this.loadData();
                },
                
                async deleteTask(id) {
                    if (!confirm('确定删除此任务？')) return;
                    await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                    window.dispatchEvent(new CustomEvent('toast', { detail: { message: '已删除' } }));
                    await this.loadData();
                },
                
                formatTrigger(trigger) {
                    if (trigger.type === 'manual') return '手动';
                    if (trigger.type === 'interval') return `每 ${trigger.interval_seconds} 秒`;
                    if (trigger.type === 'cron') return `Cron: ${trigger.cron_expr}`;
                    return trigger.type;
                }
            };
        }
        
        // Expose component for external access
        window.tasksComponentInstance = null;
        document.addEventListener('alpine:init', () => {
            window.tasksComponentInstance = Alpine.$data(document.querySelector('html'));
        });
    </script>
</body>
</html>
