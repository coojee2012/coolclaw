        - generic [ref=f1e991]:
          - text: 获取本地24小时内的天气，最方便且不需要申请复杂APIKey的方法是使用免费的开源天气API——**Open-Meteo API**。它不需要注册，支持按地理坐标查询逐小时的天气预报。为了让脚本更加实用，我编写了一个 Python 脚本，它会自动通过 IP 获取你当前的地理位置（经纬度），然后调用 Open-Meteo API 获取未来 24 小时的气温、天气状况和降水概率，并以清晰的表格形式打印出来。### 1. 安装依赖库我们需要
          - code [ref=f1e992]: requests
          - text: 库来发送网络请求。你可以运行以下命令安装：
          - code [ref=f1e994]: pip install requests
          - text: "### 2. Python 脚本 ("
          - code [ref=f1e995]: weather_24h.py
          - text: )你可以使用以下代码创建并运行这个脚本：
          - code [ref=f1e997]: "import requestsimport jsonfrom datetime import datetimedef get_location_by_ip(): \"\"\"通过IP地址自动获取当前所在的城市和经纬度\"\"\" try: response = requests.get(\"http://ip-api.com/json/?lang=zh-CN\", timeout=5) data = response.json() if data[\"status\"] == \"success\": return { \"city\": data.get(\"city\", \"未知城市\"), \"lat\": data[\"lat\"], \"lon\": data[\"lon\"] } except Exception as e: print(f\"自动获取位置失败: {e}\") # 默认返回北京的坐标作为备用 return {\"city\": \"北京 (默认)\", \"lat\": 39.9042, \"lon\": 116.4074}def get_weather_forecast(lat, lon): \"\"\"从 Open-Meteo 获取未来24小时天气预报\"\"\" url = f\"https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&timezone=auto\" try: response = requests.get(url, timeout=10) data = response.json() return data.get(\"hourly\", {}) except Exception as e: print(f\"获取天气数据失败: {e}\") return Nonedef translate_weather_code(code): \"\"\"将天气代码转换为中文描述\"\"\" weather_codes = { 0: \"晴朗 ☀️\", 1: \"主要晴朗 🌤️\", 2: \"部分多云 ⛅\", 3: \"阴天 ☁️\", 45: \"有雾 🌫️\", 48: \"雾凇 🌫️\", 51: \"轻度毛毛雨 🌧️\", 53: \"中度毛毛雨 🌧️\", 55: \"密集毛毛雨 🌧️\", 61: \"小雨 🌧️\", 63: \"中雨 🌧️\", 65: \"大雨 🌧️\", 71: \"小雪 ❄️\", 73: \"中雪 ❄️\", 75: \"大雪 ❄️\", 95: \"雷阵雨 ⛈️\", } return weather_codes.get(code, f\"未知 ({code})\")def main(): print(\"正在获取您的地理位置...\") loc = get_location_by_ip() print(f\"当前定位城市: {loc['city']} (纬度: {loc['lat']}, 经度: {loc['lon']})\\n\") print(\"正在获取 24 小时天气预报...\") hourly_data = get_weather_forecast(loc[\"lat\"], loc[\"lon\"]) if not hourly_data: print(\"未能获取到天气信息。\") return times = hourly_data.get(\"time\", []) temps = hourly_data.get(\"temperature_2m\", []) humidities = hourly_data.get(\"relative_humidity_2m\", []) precips = hourly_data.get(\"precipitation_probability\", []) codes = hourly_data.get(\"weather_code\", []) # 获取当前时间，并找到接下来的 24 小时数据 now = datetime.now() print(f\"\\n{'='*65}\") print(f\" {loc['city']} - 未来 24 小时天气预报\") print(f\"{'='*65}\") print(f\"{'时间':<18} | {'温度':<6} | {'湿度':<6} | {'降水概率':<8} | {'天气状况'}\") print(f\"{'-'*65}\") count = 0 for t, temp, hum, precip, code in zip(times, temps, humidities, precips, codes): dt = datetime.fromisoformat(t) # 只显示当前时间之后（或刚好开始）的 24 小时 if dt >= now and count < 24: time_str = dt.strftime(\"%m-%d %H:00\") weather_desc = translate_weather_code(code) print(f\"{time_str:<18} | {temp:>4}°C | {hum:>3}% | {precip:>6}% | {weather_desc}\") count += 1 print(f\"{'='*65}\")if __name__ == \"__main__\": main()"
