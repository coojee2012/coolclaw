          - code [ref=f1e421]: "import timeimport sysimport randomimport mathfrom Quartz import ( CGEventCreate, CGEventCreateMouseEvent, CGEventGetLocation, CGEventSourceCreate, CGEventPost, CGWarpMouseCursorPosition, kCGHIDEventTap, kCGEventSourceStateHIDSystemState, kCGMouseButtonLeft, kCGEventLeftMouseDown, kCGEventLeftMouseUp, kCGEventMouseMoved,)# 创建 HID 系统事件源_event_source = CGEventSourceCreate(kCGEventSourceStateHIDSystemState)def get_mouse_pos(): return CGEventGetLocation(CGEventCreate(None))def human_move(target_x, target_y, speed=0.5): \"\"\" 模拟人类平滑移动鼠标，取代瞬移 (CGWarpMouseCursorPosition) speed: 移动速度，值越大移动越快 \"\"\" start_pos = get_mouse_pos() start_x, start_y = start_pos.x, start_pos.y # 计算距离 dist = math.hypot(target_x - start_x, target_y - start_y) if dist == 0: return # 根据距离决定步数，模拟加速度 steps = int(dist / (5 * speed)) + random.randint(5, 15) for i in range(1, steps + 1): # 使用简单的线性插值 + 随机微抖动 t = i / steps # 模拟人类移动的非线性感 (简单的二次方加速) t = t * t curr_x = start_x + (target_x - start_x) * t + random.uniform(-1, 1) curr_y = start_y + (target_y - start_y) * t + random.uniform(-1, 1) move_event = CGEventCreateMouseEvent( _event_source, kCGEventMouseMoved, (curr_x, curr_y), kCGMouseButtonLeft ) CGEventPost(kCGHIDEventTap, move_event) # 随机微小延迟，模拟肌肉反应 time.sleep(random.uniform(0.001, 0.005))def cg_click(x, y): \"\"\"模拟人类点击：平滑移动 -> 随机时长按下 -> 随机时长抬起 -> 平滑还原\"\"\" old_pos = get_mouse_pos() # 1. 平滑移动到目标点 human_move(x, y) # 2. 模拟点击按下 (时长随机化) down_event = CGEventCreateMouseEvent( _event_source, kCGEventLeftMouseDown, (x, y), kCGMouseButtonLeft ) CGEventPost(kCGHIDEventTap, down_event) # 模拟人类按住鼠标的时长 (50ms - 150ms) time.sleep(random.uniform(0.05, 0.15)) # 3. 模拟点击抬起 up_event = CGEventCreateMouseEvent( _event_source, kCGEventLeftMouseUp, (x, y), kCGMouseButtonLeft ) CGEventPost(kCGHIDEventTap, up_event) # 4. 平滑还原到原位 (还原速度可以快一点，但不能瞬移) human_move(old_pos.x, old_pos.y, speed=1.2)# --- 配置参数 ---POSITION1 = (4381, 1020)POSITION2 = (3747, 849)WAIT1 = 30 WAIT2 = 5 TOTAL = 1000 OFFSET_RANGE = 5 def add_random_offset(x, y, offset_range=OFFSET_RANGE): return x + random.randint(-offset_range, offset_range), y + random.randint(-offset_range, offset_range)def simple_clicker(): print(\"🚀 增强版-模拟人类自动点击器\") print(f\"配置: Pos1{POSITION1}, Pos2{POSITION2}\") print(\"优化项: [√]平滑轨迹 [√]随机点击时长 [√]随机等待间隔\") print(\"\\n10秒后开始... 请切换到游戏窗口\") time.sleep(10) try: for i in range(1, TOTAL + 1): print(f\"\\n第 {i}/{TOTAL} 次循环\") # --- 点击位置 1 --- pos1 = add_random_offset(*POSITION1) print(f\"移动并点击位置1: {pos1}\") cg_click(*pos1) # 随机化等待时间 (WAIT1 ± 2秒) actual_wait1 = WAIT1 + random.uniform(-2, 2) print(f\"随机等待 {actual_wait1:.2f} 秒...\", end=\"\") for sec in range(int(actual_wait1), 0, -1): print(f\"\\r等待中... {sec}秒\", end=\"\") time.sleep(1) print() # --- 点击位置 2 --- pos2 = add_random_offset(*POSITION2) print(f\"移动并点击位置2: {pos2}\") cg_click(*pos2) # 两次点击之间增加随机间隔 time.sleep(random.uniform(0.5, 1.5)) cg_click(*pos2) # 随机化等待时间 (WAIT2 ± 1秒) if i < TOTAL: actual_wait2 = WAIT2 + random.uniform(-1, 1) print(f\"随机等待 {actual_wait2:.2f} 秒...\", end=\"\") for sec in range(int(actual_wait2), 0, -1): print(f\"\\r等待中... {sec}秒\", end=\"\") time.sleep(1) print() print(\"\\n任务完成!\") except KeyboardInterrupt: print(\"\\n\\n程序被用户中断\") except Exception as e: print(f\"\\n程序出错: {e}\")if __name__ == \"__main__\": simple_clicker()"
