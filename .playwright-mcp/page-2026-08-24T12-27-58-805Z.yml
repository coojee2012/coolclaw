          - text: Python 3.13 是 Python 语言的一个重要版本，带来了许多激动人心的新特性、性能改进和开发者体验提升。以下是 Python 3.13 的核心新特性亮点：### 1. 实验性的自由线程模式（Free-threaded Python / PEP 703）* **核心内容**：Python 3.13 引入了一项重大变革——支持**移除全局解释器锁（GIL）**的实验性构建版本。* **优势**：在启用无 GIL 模式（
          - code [ref=f1e1295]: "--disable-gil"
          - text: ）后，多线程代码可以真正地利用多核 CPU 并行执行，大幅提升多线程 CPU 密集型任务的性能。### 2. 全新的交互式解释器（REPL）Python 3.13 对默认的交互式终端（REPL）进行了彻底的现代化改造：* **多行编辑**：原生支持多行输入和编辑，不再需要像以前那样处理麻烦的缩进或使用复杂的替代工具。* **更好的回溯提示（Tracebacks）**：彩色化且更直观的错误堆栈信息。* **配色方案**：支持主题配色。* **命令历史与粘贴支持**：改进了历史记录导航和向后粘贴多行代码的体验。### 3. 即时编译器（JIT Compiler）的雏形* Python 3.13 为未来的性能优化奠定了基础，引入了一个实验性的基于复制追踪（copy-and-patch）的 **JIT 编译器框架**。* 虽然在默认构建中可能不会带来显着的开销减少，但它为后续版本的进一步提速铺平了道路。### 4. 改进的错误提示与 Traceback* 延续了 Python 3.10 以来对错误提示的优化，Python 3.13 进一步改进了某些语法错误、NameError、AttributeError 等的提示信息，能够更精确地指出错误发生的位置。### 5. 标准库的清理与更新* **移除冗余模块**：根据 PEP 594，Python 3.13 正式移除了许多长期废弃的标准库模块（如
