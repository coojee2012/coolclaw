ttonLeft ) CGEventPost(kCGHIDEventTap, down_event) # 模拟人类按住鼠标的时长 (50ms - 150ms) time.sleep(random.uniform(0.05, 0.15)) # 增加随机性 # 3. 模拟点击抬起 up_event = CGEventCreateMouseEvent( _event_source, kCGEventLeftMouseUp, (x, y), kCGMouseButtonLeft ) CGEventPost(kCGHIDEventTap, up_event) # 4. 平滑还原到原位 (还原速度可以快一点，但不能瞬移) # 只有当原始位置与目标位置有明显差异时才还原 if math.hypot(old_pos.x - x, old_pos.y - y) > 5: # 避免在原地点击后还移动 human_move(old_pos.x, old_pos.y, speed=1.5) # 还原速度可以稍快# --- 配置参数 ---# 请根据你的游戏和屏幕分辨率调整这些坐标POSITION1 = (4381, 1020) # 示例坐标POSITION2 = (3747, 849) # 示例坐标WAIT1 = 30 # 第一次点击后的基础等待时间 (秒)WAIT2 = 5 # 第二次点击后的基础等待时间 (秒)TOTAL = 1000 # 总循环次数OFFSET_RANGE = 5 # 鼠标点击位置的随机偏移范围 (像素)def add_random_offset(x, y, offset_range=OFFSET_RANGE): \"\"\"在给定坐标周围添加一个随机偏移，模拟点击不精确性\"\"\" return x + random.randint(-offset_range, offset_range), y + random.randint(-offset_range, offset_range)def simple_clicker(): print(\"🚀 增强版-模拟人类自动点击器\") print(f\"配置: Pos1{POSITION1}, Pos2{POSITION2}\") print(\"优化项: [√]平滑轨迹 [√]随机点击时长 [√]随机等待间隔 [√]点击位置微抖动\") print(\"\\n10秒后开始... 请切换到游戏窗口\") time.sleep(10) # 给予用户切换窗口的时间 try: for i in range(1, TOTAL + 1): print(f\"\\n第 {i}/{TOTAL} 次循环\") # --- 点击位置 1 --- pos1 = add_random_offset(*POSITION1) # 应用随机偏移 print(f\"移动并点击位置1: {pos1}\") cg_click(*pos1) # 随机化等待时间 (WAIT1 ± 2秒)，增加不确定性 actual_wait1 = WAIT1 + random.uniform(-2, 2) print(f\"随机等待 {actual_wait1:.2f} 秒...\", end=\"\") for sec in range(int(actual_wait1), 0, -1): print(f\"\\r等待中... {sec}秒\", end=\"\") time.sleep(1) print() # --- 点击位置 2 --- pos2 = add_random_offset(*POSITION2) # 应用随机偏移 print(f\"移动并点击位置2: {pos2}\") cg_click(*pos2) # 两次点击之间增加随机间隔，模拟人类思考或反应时间 time.sleep"
